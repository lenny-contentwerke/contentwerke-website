<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danke — Contentwerke</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Cpath d='M20 11a6 6 0 100 10' fill='none' stroke='%23ff2a39' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--red:#ff2a39}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0b;color:#f3f1ea;font-family:"Archivo",system-ui,sans-serif;text-align:center;padding:2rem;overflow:hidden}
  .glow{position:fixed;top:15%;left:50%;width:70vw;height:70vw;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,42,57,.2),transparent 60%);pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:560px}
  .tag{font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:1.2rem}
  .check{width:84px;height:84px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:0 auto 1.6rem;box-shadow:0 0 40px rgba(255,42,57,.5)}
  .check svg{width:40px;height:40px}
  h1{font-weight:900;font-size:clamp(2rem,5vw,3.2rem);text-transform:uppercase;letter-spacing:-.02em;margin:0 0 1rem}
  p{color:#a9a7a2;font-size:1.1rem;margin:0 auto 2rem;max-width:42ch;line-height:1.6}
  a{display:inline-flex;align-items:center;gap:.5rem;font-weight:800;color:#fff;background:var(--red);padding:.9rem 1.7rem;border-radius:40px;text-decoration:none;transition:.25s}
  a:hover{background:#d80f22;transform:translateY(-2px)}
  .brand{font-family:Impact,'Anton','Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:1.5rem;letter-spacing:.01em;color:#f3f1ea;background:none;padding:0;text-decoration:none;display:inline-block;margin:0 0 2.2rem;transition:color .2s}
  .brand:hover{background:none;transform:none;color:#fff}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <a class="brand" href="/" aria-label="Contentwerke – Start">CONTENTWERKE</a>
  <p class="tag">Anfrage eingegangen</p>
  <div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>Danke – wir melden uns!</h1>
  <p>Deine Nachricht ist bei uns gelandet. Wir schauen sie uns an und melden uns schnellstmöglich bei dir. Kurze Wege, versprochen.</p>
  <a href="/">Zurück zur Startseite →</a>
</div>
<canvas id="skat" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5"></canvas>
<script>
(function(){
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv=document.getElementById("skat"), g=cv.getContext("2d");
  var dpr=Math.min(window.devicePixelRatio||1,2), W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  var suits=[{s:"♠",c:"#e9e7e0"},{s:"♣",c:"#e9e7e0"},{s:"♥",c:"#ff2a39"},{s:"♦",c:"#ff2a39"}];
  var P=[]; for(var n=0;n<150;n++){var su=suits[(Math.random()*4)|0];
    P.push({x:Math.random()*W,y:-30-Math.random()*H*0.6,vy:2.2+Math.random()*3.6,vx:(Math.random()-0.5)*2.4,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.26,size:13+Math.random()*18,su:su,sway:Math.random()*6.28});}
  var start=performance.now(),last=start,raf;
  function loop(now){var dt=Math.min(48,now-last);last=now;g.clearRect(0,0,W,H);var alive=0;
    for(var i=0;i<P.length;i++){var p=P[i];p.sway+=0.03;p.x+=p.vx+Math.sin(p.sway)*0.8;p.y+=p.vy*(dt/16.7);p.rot+=p.vr;
      if(p.y<H+50)alive++;var fade=p.y>H*0.82?Math.max(0,1-(p.y-H*0.82)/(H*0.25)):1;
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.globalAlpha=fade;g.fillStyle=p.su.c;g.font="700 "+p.size+"px serif";g.textAlign="center";g.textBaseline="middle";g.fillText(p.su.s,0,0);g.restore();}
    if(alive>0&&now-start<6500)raf=requestAnimationFrame(loop);else{cancelAnimationFrame(raf);cv.remove();}}
  raf=requestAnimationFrame(loop);
})();
</script>

</body>
</html>
