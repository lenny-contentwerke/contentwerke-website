<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Contentwerke</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Cpath d='M20 11a6 6 0 100 10' fill='none' stroke='%23ff2a39' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{--red:#ff2a39}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0a0a0b;color:#f3f1ea;font-family:"Archivo",system-ui,sans-serif;text-align:center;padding:2rem;overflow:hidden}
  .glow{position:fixed;top:20%;left:50%;width:70vw;height:70vw;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,42,57,.18),transparent 60%);pointer-events:none}
  .wrap{position:relative;z-index:1}
  .code{font-weight:900;font-size:clamp(6rem,26vw,16rem);line-height:.9;letter-spacing:-.05em}
  .code span{color:var(--red)}
  h1{font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);text-transform:uppercase;letter-spacing:-.02em;margin:.6rem 0 1rem}
  p{color:#a9a7a2;font-size:1.05rem;max-width:38ch;margin:0 auto 2rem}
  .tag{font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:1rem}
  a{display:inline-flex;align-items:center;gap:.5rem;font-weight:800;font-size:1rem;color:#fff;
    background:var(--red);padding:.9rem 1.7rem;border-radius:40px;text-decoration:none;transition:.25s}
  a:hover{background:#d80f22;transform:translateY(-2px)}
  .brand{font-family:Impact,'Anton','Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:1.5rem;letter-spacing:.01em;color:#f3f1ea;background:none;padding:0;text-decoration:none;display:inline-block;margin:0 0 2rem;transition:color .2s}
  .brand:hover{background:none;transform:none;color:#fff}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <a class="brand" href="/" aria-label="Contentwerke – Start">CONTENTWERKE</a>
  <p class="tag">Fehler 404 · verlaufen im Osten</p>
  <div class="code">4<span>0</span>4</div>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht ein alter Link – aber keine Sorge, wir bringen dich zurück auf Kurs.</p>
  <a href="/">Zurück zur Startseite →</a>
</div>
</body>
</html>
