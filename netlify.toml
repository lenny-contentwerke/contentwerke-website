# Netlify configuration — Contentwerke Onepager (statisch, kein Framework-Build)
[build]
  command = "node build.js"   # kopiert nur die Website-Dateien nach dist/
  publish = "dist"            # dieser Ordner wird veröffentlicht

[build.environment]
  NODE_VERSION = "20"

# Nette URLs / Fallback: eigene 404-Seite (Netlify nutzt dist/404.html automatisch)

# Sicherheits- & Cache-Header (Fallback, falls _headers nicht greift)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/seq/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
